buildscript {
	repositories {
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.5.3'
		classpath 'io.spring.gradle:dependency-management-plugin:1.1.7'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spotless configuration for auto-formatting
spotless {
	java {
		target '**/*.java'
		googleJavaFormat('1.27.0').aosp().reflowLongStrings()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		importOrder('java', 'javax', 'org', 'com', '')
		formatAnnotations()
	}
	
	// Format build files
	groovyGradle {
		target '**/*.gradle'
		greclipse()
		indentWithTabs()
		trimTrailingWhitespace()
		endWithNewline()
	}
	
	// Format other files
	format 'misc', {
		target '**/*.md', '**/*.yml', '**/*.yaml', '**/*.properties'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Checkstyle configuration for code linting
checkstyle {
	toolVersion = '10.12.5'
	configFile = file('config/checkstyle/checkstyle.xml')
	configProperties = [
		'checkstyle.cache.file': "${buildDir}/checkstyle.cache"
	]
	ignoreFailures = false
	maxWarnings = 0
	maxErrors = 0
}

// Configure Checkstyle tasks
checkstyleMain {
	source = 'src/main/java'
}

checkstyleTest {
	source = 'src/test/java'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ========== GIT HOOKS SETUP TASK ==========

task setupHooks(type: Exec) {
	group = 'setup'
	description = 'Setup Git hooks with Lefthook for code quality automation'
	
	// Check if Lefthook is installed, if not provide helpful error message
	doFirst {
		try {
			// Windows-compatible command execution
			if (System.getProperty('os.name').toLowerCase().contains('windows')) {
				exec {
					commandLine 'cmd', '/c', 'lefthook', 'version'
					standardOutput = new ByteArrayOutputStream()
				}
			} else {
				exec {
					commandLine 'lefthook', 'version'
					standardOutput = new ByteArrayOutputStream()
				}
			}
			println '🔧 Setting up Git hooks with Lefthook...'
		} catch (Exception e) {
			// Try npx as fallback for Windows
			try {
				if (System.getProperty('os.name').toLowerCase().contains('windows')) {
					exec {
						commandLine 'cmd', '/c', 'npx', 'lefthook', 'version'
						standardOutput = new ByteArrayOutputStream()
					}
				} else {
					exec {
						commandLine 'npx', 'lefthook', 'version'
						standardOutput = new ByteArrayOutputStream()
					}
				}
				println '🔧 Setting up Git hooks with Lefthook (via npx)...'
			} catch (Exception e2) {
				throw new GradleException(
					'❌ Lefthook is not installed or not accessible!\n\n' +
					'Please try one of these installation methods:\n\n' +
					'Via npm (global - recommended):\n' +
					'  npm install -g @evilmartians/lefthook@latest\n\n' +
					'Via npm (local - if global fails):\n' +
					'  npm install lefthook --save-dev\n\n' +
					'Alternative Windows methods:\n' +
					'  scoop install lefthook\n' +
					'  winget install evilmartians.lefthook\n\n' +
					'Then run: ./gradlew setupHooks\n\n' +
					'Debug info:\n' +
					'  First attempt error: ' + e.message + '\n' +
					'  NPX fallback error: ' + e2.message
				)
			}
		}
	}
	
	// Install the Git hooks - Windows compatible
	if (System.getProperty('os.name').toLowerCase().contains('windows')) {
		commandLine 'cmd', '/c', 'lefthook', 'install'
	} else {
		commandLine 'lefthook', 'install'
	}
	
	doLast {
		println '✅ Git hooks setup complete!\n'
		println 'Your project now has the following automated checks:'
		println '📝 Pre-commit:  Code formatting, linting, unit tests'
		println '🚀 Pre-push:    Full test suite, build verification'
		println '💬 Commit-msg:  Conventional commit format validation\n'
		println 'Available commands:'
		println '  ./gradlew setupHooks           - Setup/reinstall Git hooks'
		println '  lefthook run pre-commit        - Run pre-commit hooks manually'
		println '  lefthook run pre-push          - Run pre-push hooks manually'
		println '  ./gradlew spotlessApply        - Auto-format code'
		println '  ./gradlew checkstyleMain       - Run code quality checks'
		println '  ./gradlew test                 - Run tests\n'
		println 'Happy coding! 🎉'
	}
}

wrapper {
    gradleVersion = '8.15'
    distributionType = Wrapper.DistributionType.ALL
}
