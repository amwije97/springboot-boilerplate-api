# Lefthook configuration for Git hooks
# https://github.com/evilmartians/lefthook

min_version: 1.11.14

pre-commit:
  # Sequential execution for proper formatting flow
  parallel: false

  commands:
    # STEP 1: Auto-format code with Spotless (apply fixes)
    spotless-apply:
      tags: formatting java
      run: ./gradlew spotlessApply
      fail_text: "Spotless auto-formatting failed. Please check for syntax errors in your code."
      stage_fixed: true

    # STEP 2: Check formatting with Spotless (verify formatting is correct)
    spotless-check:
      tags: formatting java
      run: ./gradlew spotlessCheck
      fail_text: "Spotless formatting check failed after auto-formatting. This should not happen - please report this issue."
      stage_fixed: true

    # STEP 3: Run Checkstyle linting (after code is properly formatted)
    checkstyle:
      tags: linting java
      run: ./gradlew checkstyleMain checkstyleTest
      fail_text: "Checkstyle violations found. Please fix the code quality issues."

    # STEP 4: Compile and run tests (final verification)
    test:
      tags: testing java
      run: ./gradlew test --no-daemon
      fail_text: "Tests failed. Please fix failing tests before committing."



  scripts:
    # Custom script to check for TODO/FIXME comments in staged files
    "todo-check":
      runner: bash
      tags: quality
      skip:
        - merge
        - rebase
      script: |
        echo "Checking for TODO/FIXME comments in staged files..."
        STAGED_FILES=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(java|kt|js|ts|py)$' || true)
        if [ -n "$STAGED_FILES" ]; then
          TODOS=$(git diff --cached $STAGED_FILES | grep -iE '^\+.*\b(TODO|FIXME|XXX|HACK)\b' || true)
                  if [ -n "$TODOS" ]; then
          echo "⚠️  Found TODO/FIXME comments in staged files:"
          echo "$TODOS"
          echo ""
          echo "Consider resolving these before committing, or add // NOSONAR if intentional."
          echo "ℹ️  This is a warning only - commit will proceed."
          exit 0
        fi
        fi
        echo "✅ No TODO/FIXME comments found in staged files."

pre-push:
  # Sequential execution for comprehensive checks
  parallel: false

  commands:
    # Unit tests (fast local feedback)
    test:
      tags: testing java
      run: ./gradlew clean test --no-daemon
      fail_text: "Unit tests failed. Please fix all failing tests before pushing."

    # Build the entire project
    build:
      tags: build java
      run: ./gradlew build --no-daemon
      fail_text: "Build failed. Please fix build issues before pushing."

    # Run static analysis
    static-analysis:
      tags: quality java
      run: ./gradlew check --no-daemon
      fail_text: "Static analysis checks failed. Please fix quality issues before pushing."

  scripts:
    # Check branch naming convention
    "branch-naming":
      runner: bash
      tags: git
      script: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        VALID_PATTERN="^(feat|feature|fix|bugfix|hotfix|docs|test|chore|patch|refactor)\/[a-z0-9-]+$"

        if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "develop" ]]; then
          echo "✅ Pushing to protected branch: $BRANCH"
          exit 0
        fi

        if [[ ! $BRANCH =~ $VALID_PATTERN ]]; then
          echo "❌ Branch name '$BRANCH' does not follow naming convention."
          echo "Expected pattern: feat/description, feature/description, fix/description, bugfix/description, etc."
          echo "Examples:"
          echo "  feat/user-authentication (Conventional Commits style)"
          echo "  feature/user-authentication (Git Flow style)"
          echo "  fix/login-issue (Conventional Commits style)"
          echo "  bugfix/login-issue (Git Flow style)"
          exit 1
        fi
        echo "✅ Branch name follows convention: $BRANCH"

commit-msg:
  scripts:
    # Validate commit message format
    "conventional-commit":
      runner: bash
      tags: git
      script: |
        # Read commit message
        MSG=$(cat "$1")

        # Check conventional commit format
        if ! echo "$MSG" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?: .{1,50}'; then
          echo "❌ Commit message does not follow Conventional Commits format!"
          echo ""
          echo "Expected format:"
          echo "  type(scope): description"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
          echo "Example: feat: add user login functionality"
          echo "Example: feat(auth): add user login functionality"
          echo "Example: fix: resolve null pointer exception in user service"
          echo "Example: fix(api): resolve null pointer exception in user service"
          exit 1
        fi
        echo "✅ Commit message follows Conventional Commits format"

# Skip hooks for emergency situations
skip_output:
  - meta
  - summary

# Colors for better readability
colors: true

# Enable output streaming for long-running commands
output:
  - execution
  - execution_out
  - execution_info
  - skips
